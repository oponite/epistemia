project:
  type: website
  output-dir: _site
  resources:
    - experiments/subset_sum/*.py
    - experiments/subset_sum/results.csv
    - experiments/subset_sum/benchmark.png
    - experiments/subset_sum/README.md
    - experiments/subset_sum/baseline/
    - experiments/subset_sum/all_sizes/
    - experiments/subset_sum/cardinality/
    - experiments/subset_sum/layers/
    - experiments/subset_sum/bidirectional/
  render:
    - index.qmd
    - papers/**/*.qmd
    - papers/**/*.md

website:
  title: Epistemia
  site-url: https://oponite.github.io/epistemia/
  search: false
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: papers/index.qmd
        text: Papers

format:
  html:
    theme: cosmo
    toc: true
    lang: en
